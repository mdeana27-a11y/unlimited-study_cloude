# Local / VPS stack with a REAL PostgreSQL. Copy .env.example to .env, set SESSION_SECRET + ADMIN_PASSWORD, then: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: study, POSTGRES_PASSWORD: "${DB_PASSWORD:-change-me-locally}", POSTGRES_DB: unlimited_study }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U study -d unlimited_study"], interval: 5s, timeout: 3s, retries: 20 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: "postgres://study:${DB_PASSWORD:-change-me-locally}@db:5432/unlimited_study"
      STORAGE_DRIVER: local           # uploads go to the persistent volume below; set GCS_BUCKET instead to use Google Cloud Storage
      STORAGE_DIR: /data
      PORT: "8080"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"     # plain http://localhost; put HTTPS in front for real use and remove this line
    ports: [ "3000:8080" ]
    volumes: [ "uploads:/data" ]
volumes: { pgdata: {}, uploads: {} }
